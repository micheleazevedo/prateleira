```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Prateleira</title>


    <style>

        /* =========================
           CONFIGURAÇÕES GERAIS
           ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        :root {

            --creme: #f6f0e5;
            --creme-claro: #fbf8f1;
            --branco: #fffdf8;

            --verde: #496b5a;
            --verde-escuro: #365344;
            --verde-claro: #dfe9df;

            --texto: #263a31;
            --texto-suave: #788078;

            --borda: #e3ddd1;

            --dourado: #c7984b;

        }


        body {

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: var(--creme);

            color: var(--texto);

            transition:
                background 0.3s,
                color 0.3s;

        }


        .app {

            max-width: 430px;

            margin: auto;

            min-height: 100vh;

            padding-bottom: 105px;

        }


        button {

            font-family: inherit;

        }


        /* =========================
           TOPO
           ========================= */

        .topo {

            padding:
                28px
                20px
                18px;

        }


        .saudacao {

            color: var(--texto-suave);

            font-size: 13px;

            margin-bottom: 5px;

        }


        .topo h1 {

            font-family: Georgia, "Times New Roman", serif;

            font-size: 31px;

            color: var(--verde-escuro);

            letter-spacing: -0.5px;

        }


        .topo h1::after {

            content: "";

            display: block;

            width: 38px;

            height: 3px;

            background: var(--verde);

            border-radius: 5px;

            margin-top: 8px;

        }


        /* =========================
           RESUMO
           ========================= */

        .resumo {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap: 11px;

            margin:
                2px
                20px
                22px;

        }


        .card {

            background: var(--branco);

            border:
                1px solid
                var(--borda);

            border-radius: 18px;

            padding: 17px;

            box-shadow:
                0 2px 8px
                rgba(58, 73, 62, 0.04);

            transition:
                background 0.3s,
                border-color 0.3s;

        }


        .card-icone {

            width: 39px;

            height: 39px;

            display: flex;

            align-items: center;

            justify-content: center;

            background: var(--verde-claro);

            border-radius: 12px;

            font-size: 20px;

            margin-bottom: 10px;

        }


        .card-numero {

            display: block;

            font-size: 25px;

            font-weight: bold;

            color: var(--verde-escuro);

            margin-bottom: 4px;

        }


        .card-texto {

            color: var(--texto-suave);

            font-size: 11px;

        }


        /* =========================
           BOTÃO ADICIONAR
           ========================= */

        .botao-adicionar {

            margin:
                0
                20px
                26px;

            width:
                calc(100% - 40px);

            border: none;

            border-radius: 15px;

            background: var(--verde);

            color: white;

            padding: 15px;

            font-size: 14px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 5px 14px
                rgba(73, 107, 90, 0.20);

            transition:
                background 0.2s,
                transform 0.2s;

        }


        .botao-adicionar:active {

            transform: scale(0.98);

        }


        /* =========================
           TÍTULOS DAS SEÇÕES
           ========================= */

        .titulo-secao {

            display: flex;

            justify-content:
                space-between;

            align-items:
                center;

            margin:
                0
                20px
                12px;

        }


        .titulo-secao strong {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 17px;

        }


        .ver-todos {

            border: none;

            background: transparent;

            color: var(--verde);

            font-size: 11px;

            font-weight: bold;

        }

           CATEGORIA LIVROS
           ========================= */

        .categorias {

            margin:
                0
                20px
                27px;

        }


        .categoria {

            background: var(--branco);

                1px solid

            border-radius: 17px;

            padding: 16px;

            display: flex;

            align-items: center;

            gap: 13px;

            cursor: pointer;

            box-shadow:
                0 2px 8px
                rgba(58, 73, 62, 0.04);

                background 0.3s,

                transform 0.2s;

        }


        .categoria:active {

            transform: scale(0.99);

        }


        .categoria-icone {

            width: 48px;

        }


        .categoria-info {

            flex: 1;

        }


        .categoria strong {

            display: block;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

        }


        .categoria-seta {

            color: var(--verde);

        }


        /* =========================
           RECENTES
           ========================= */

        .recentes {

            margin:
                0
                20px;

        }


        .item {

            display: flex;

            align-items: center;

            gap: 13px;

            background: var(--branco);

            border:
                1px solid
                var(--borda);

            border-radius: 16px;

            padding: 10px;

            margin-bottom: 10px;

            cursor: pointer;

            box-shadow:
                0 2px 7px

            transition:
                background 0.3s,

                transform 0.2s;

        }


        .item:active {

            transform: scale(0.99);

        }


        .capa {

            width: 52px;

            height: 70px;

            border-radius: 8px;

            background: var(--verde-claro);

            display: flex;

            align-items: center;

            justify-content: center;

            flex-shrink: 0;

            overflow: hidden;

            font-size: 24px;

        }


        .capa img {

            width: 100%;

            height: 100%;

            object-fit: cover;

        }


        .item-info {

            flex: 1;

            min-width: 0;

        }


        .item-titulo {

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 14px;

            font-weight: bold;

            color: var(--texto);

            margin-bottom: 5px;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

        }


        .item-tipo {

            color: var(--texto-suave);

            font-size: 10px;

            margin-bottom: 5px;

        }


        .item-leitura {

            color: var(--verde);

            font-size: 10px;

            margin-bottom: 4px;

            font-weight: bold;

        }


        .item-estrelas {

            color: var(--dourado);

            font-size: 13px;

            letter-spacing: 1px;

        }


        /* =========================
           ESTADO VAZIO
           ========================= */

        .vazio {

            background: var(--branco);

            border:
                1px dashed
                var(--borda);

            border-radius: 17px;

            padding:
                32px
                18px;

            text-align: center;

            color: var(--texto-suave);

        }


        .vazio span {

            display: block;

            font-size: 39px;

            margin-bottom: 10px;

        }


        .vazio p {

            font-size: 12px;

            line-height: 1.5;

            margin-bottom: 15px;

        }


        .vazio button {

            border: none;

            background: var(--verde);

            color: white;

            border-radius: 12px;

            padding:
                11px
                16px;

            font-size: 11px;

            font-weight: bold;

            cursor: pointer;

        }


        /* =========================
           NAVEGAÇÃO
           ========================= */

        .navegacao {

            position: fixed;

            bottom: 0;

            left: 50%;

            transform:
                translateX(-50%);

            width: 100%;

            max-width: 430px;

            background: var(--branco);

            border-top:
                1px solid
                var(--borda);

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            padding:
                9px
                5px
                8px;

            z-index: 100;

            transition:
                background 0.3s,
                border-color 0.3s;

        }


        .nav-item {

            border: none;

            background: transparent;

            color: var(--texto-suave);

            cursor: pointer;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            gap: 4px;

        }


        .nav-item span {

            font-size: 20px;

        }


        .nav-item small {

            font-size: 9px;

        }


        .nav-item.ativo {

            color: var(--verde);

            font-weight: bold;

        }


        /* =========================
           BOTÃO CENTRAL +
           ========================= */

        .nav-item.adicionar span {

            width: 43px;

            height: 43px;

            margin-top: -25px;

            border-radius: 50%;

            background: var(--verde);

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 25px;

            box-shadow:
                0 5px 13px
                rgba(73, 107, 90, 0.25);

        }


        .nav-item.adicionar small {

            margin-top: 2px;

        }


        /* =========================
           MODO ESCURO
           ========================= */

        body.modo-escuro {

            --creme: #17211c;

            --creme-claro: #1c2822;

            --branco: #202c26;

            --verde: #91b39a;

            --verde-escuro: #b6cfbb;

            --verde-claro: #2d4034;

            --texto: #edf2ed;

            --texto-suave: #aab6ad;

            --borda: #34453a;

            --dourado: #d7ad62;

            background: var(--creme);

            color: var(--texto);

        }


        body.modo-escuro .topo h1 {

            color: var(--verde-escuro);

        }


        body.modo-escuro .topo h1::after {

            background: var(--verde);

        }


        body.modo-escuro .card-numero {

            color: var(--verde-escuro);

        }


        body.modo-escuro .titulo-secao strong {

            color: var(--verde-escuro);

        }


        body.modo-escuro .categoria strong {

            color: var(--verde-escuro);

        }


        body.modo-escuro .item-titulo {

            color: var(--texto);

        }


        body.modo-escuro .item-leitura {

            color: var(--verde);

        }


        body.modo-escuro .ver-todos {

            color: var(--verde);

        }


        /* =========================
           TELAS MAIORES
           ========================= */

        @media (min-width: 431px) {

            body {

                background: #eae7df;

            }

            body.modo-escuro {

                background: #111813;

            }

            .app {

                background: var(--creme);

                box-shadow:
                    0 0 30px
                    rgba(0, 0, 0, 0.06);

            }

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =========================
         TOPO
         ========================= -->

    <header class="topo">

        <div class="saudacao">
            Bem-vinda à sua
        </div>

        <h1>
            Prateleira
        </h1>

    </header>


    <!-- =========================
         RESUMO
         ========================= -->

    <section class="resumo">


        <div class="card">

            <div class="card-icone">
                📚
            </div>

            <span
                class="card-numero"
                id="total"
            >
                0
            </span>

            <span class="card-texto">
                Livros na Prateleira
            </span>

        </div>


        <div class="card">

            <div class="card-icone">
                ❤️
            </div>

            <span
                class="card-numero"
                id="favoritos"
            >
                0
            </span>

            <span class="card-texto">
                Livros favoritos
            </span>

        </div>


    </section>


    <!-- =========================
         ADICIONAR
         ========================= -->

    <button
        class="botao-adicionar"
        onclick="location.href='novo.html'"
    >
        + &nbsp; Adicionar novo livro
    </button>


    <!-- =========================
         MINHA PRATELEIRA
         ========================= -->

    <div class="titulo-secao">

        <strong>
            Minha Prateleira
        </strong>

        <button
            class="ver-todos"
            onclick="location.href='biblioteca.html'"
        >
            Ver todos →
        </button>

    </div>


    <div class="categorias">


        <div
            class="categoria"
            onclick="abrirBiblioteca()"
        >

            <div class="categoria-icone">
                📖
            </div>

            <div class="categoria-info">

                <strong>
                    Meus livros
                </strong>

                <small id="livros">
                    0 livros
                </small>

            </div>

            <div class="categoria-seta">
                →
            </div>

        </div>


    </div>


    <!-- =========================
         RECENTES
         ========================= -->

    <div class="titulo-secao">

        <strong>
            Adicionados recentemente
        </strong>

        <button
            class="ver-todos"
            onclick="location.href='biblioteca.html'"
        >
            Ver todos →
        </button>

    </div>


    <div
        class="recentes"
        id="recentes"
    >

    </div>


</div>


<!-- =========================
     NAVEGAÇÃO
     ========================= -->

<nav class="navegacao">


    <button
        class="nav-item ativo"
        onclick="location.href='index.html'"
    >

        <span>
            ⌂
        </span>

        <small>
            Início
        </small>

    </button>


    <button
        class="nav-item"
        onclick="location.href='biblioteca.html'"
    >

        <span>
            📚
        </span>

        <small>
            Biblioteca
        </small>

    </button>


    <button
        class="nav-item adicionar"
        onclick="location.href='novo.html'"
    >

        <span>
            +
        </span>

        <small>
            Adicionar
        </small>

    </button>


    <button
        class="nav-item"
        onclick="location.href='perfil.html'"
    >

        <span>
            👤
        </span>

        <small>
            Perfil
        </small>

    </button>


</nav>


<script>


/* =========================
   MODO GLOBAL
   =========================

   O modo é escolhido na página
   Perfil e salvo no localStorage.
   ========================= */

function aplicarModo() {

    const modo =
        localStorage.getItem(
            "modoPrateleira"
        ) || "claro";


    if (modo === "escuro") {

        document.body.classList.add(
            "modo-escuro"
        );

    } else {

        document.body.classList.remove(
            "modo-escuro"
        );

    }

}


aplicarModo();


/* =========================
   ACERVO
   ========================= */

let acervo = [];


try {

    acervo =
        JSON.parse(
            localStorage.getItem(
                "acervo"
            )
        ) || [];

} catch (erro) {

    console.error(
        "Erro ao carregar a Prateleira:",
        erro
    );

    acervo = [];

}


/* =========================
   CONSIDERAR APENAS LIVROS
   ========================= */

const livrosAcervo =
    acervo.filter(function(item) {

        return item.tipo === "Livro";

    });


/* =========================
   FAVORITOS
   ========================= */

let favoritos = 0;


livrosAcervo.forEach(function(item) {

    if (item.favorito === true) {

        favoritos++;

    }

});


/* =========================
   MOSTRAR CONTADORES
   ========================= */

document.getElementById(
    "total"
).textContent =
    livrosAcervo.length;


document.getElementById(
    "favoritos"
).textContent =
    favoritos;


document.getElementById(
    "livros"
).textContent =
    livrosAcervo.length +
    (
        livrosAcervo.length === 1
            ? " livro"
            : " livros"
    );


/* =========================
   RECENTES
   ========================= */

const recentes =
    document.getElementById(
        "recentes"
    );


if (livrosAcervo.length === 0) {


    recentes.innerHTML = `

        <div class="vazio">

            <span>
                📚
            </span>

            <p>
                Sua Prateleira ainda está vazia.
                <br>
                Comece adicionando seu primeiro livro!
            </p>

            <button
                onclick="location.href='novo.html'"
            >
                Adicionar primeiro livro
            </button>

        </div>

    `;


} else {


    /*
        Mostra os últimos 5 livros.
        O mais recente aparece primeiro.
    */

    const ultimos =
        livrosAcervo
            .slice()
            .reverse()
            .slice(0, 5);


    ultimos.forEach(function(item) {


        const div =
            document.createElement(
                "div"
            );


        div.className =
            "item";


        div.onclick =
            function() {


                /*
                    Encontramos o índice
                    original dentro do acervo
                    completo para manter a
                    compatibilidade com
                    detalhes.html.
                */

                const indice =
                    acervo.indexOf(item);


                localStorage.setItem(
                    "itemSelecionado",
                    indice
                );


                location.href =
                    "detalhes.html";

            };


        /* =========================
           CAPA
           ========================= */

        const capa =
            document.createElement(
                "div"
            );


        capa.className =
            "capa";


        if (item.capa) {


            const img =
                document.createElement(
                    "img"
                );


            img.src =
                item.capa;


            img.alt =
                "Capa de " +
                (
                    item.titulo ||
                    "livro"
                );


            capa.appendChild(
                img
            );


        } else {


            const span =
                document.createElement(
                    "span"
                );


            span.textContent =
                "📖";


            capa.appendChild(
                span
            );

        }


        /* =========================
           INFORMAÇÕES
           ========================= */

        const info =
            document.createElement(
                "div"
            );


        info.className =
            "item-info";


        /* TÍTULO */

        const titulo =
            document.createElement(
                "div"
            );


        titulo.className =
            "item-titulo";


        titulo.textContent =
            item.titulo ||
            "Sem título";


        info.appendChild(
            titulo
        );


        /* TIPO */

        const tipo =
            document.createElement(
                "div"
            );


        tipo.className =
            "item-tipo";


        tipo.textContent =
            "Livro";


        info.appendChild(
            tipo
        );


        /* =========================
           LEITURA
           ========================= */

        const numeroLeitura =
            item.leituraNumero ||
            item.leitura ||
            item.numeroLeitura;


        let textoLeitura =
            "";


        if (numeroLeitura) {

            textoLeitura =
                "Leitura #" +
                numeroLeitura;

        }


        if (item.mesLeitura) {


            if (textoLeitura) {

                textoLeitura +=
                    " • " +
                    item.mesLeitura;

            } else {

                textoLeitura =
                    item.mesLeitura;

            }

        }


        if (textoLeitura) {


            const leitura =
                document.createElement(
                    "div"
                );


            leitura.className =
                "item-leitura";


            leitura.textContent =
                textoLeitura;


            info.appendChild(
                leitura
            );

        }


        /* =========================
           ESTRELAS
           ========================= */

        const estrelas =
            document.createElement(
                "div"
            );


        estrelas.className =
            "item-estrelas";


        const nota =
            Number(item.nota) || 0;


        if (nota > 0) {

            const notaLimitada =
                Math.min(
                    Math.max(
                        Math.round(nota),
                        0
                    ),
                    5
                );


            estrelas.textContent =
                "★".repeat(
                    notaLimitada
                ) +
                "☆".repeat(
                    5 - notaLimitada
                );

        }


        info.appendChild(
            estrelas
        );


        /* =========================
           MONTAR ITEM
           ========================= */

        div.appendChild(
            capa
        );


        div.appendChild(
            info
        );


        recentes.appendChild(
            div
        );

    });

}


/* =========================
   ABRIR BIBLIOTECA
   ========================= */

function abrirBiblioteca() {

    /*
        Não precisamos mais de filtro
        por tipo porque a Prateleira
        trabalha somente com livros.
    */

    location.href =
        "biblioteca.html";

}


</script>


</body>

</html>
